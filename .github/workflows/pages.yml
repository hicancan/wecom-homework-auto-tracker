name: Deploy Web To Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - webapp/**
      - local/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Inject deploy timestamp
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          now = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
          deploy_time = now.strftime("%Y-%m-%d %H:%M:%S")

          index_path = Path("webapp/public/collections.json")
          if index_path.exists():
            index_data = json.loads(index_path.read_text(encoding="utf-8"))
          else:
            index_data = {"收集表列表": []}

          index_data["最后部署时间"] = deploy_time
          index_path.parent.mkdir(parents=True, exist_ok=True)
          index_path.write_text(json.dumps(index_data, ensure_ascii=False, indent=2), encoding="utf-8")

          for item in index_data.get("收集表列表", []):
            rel = item.get("数据文件")
            if not rel:
              continue
            data_path = Path("webapp/public") / rel
            if not data_path.exists():
              continue
            try:
              course_data = json.loads(data_path.read_text(encoding="utf-8"))
            except json.JSONDecodeError:
              continue
            course_data["最后部署时间"] = deploy_time
            data_path.write_text(json.dumps(course_data, ensure_ascii=False, indent=2), encoding="utf-8")
            for submission in course_data.get("提交序号列表", []):
              submission_rel = submission.get("数据文件")
              if not submission_rel:
                continue
              submission_path = Path("webapp/public") / submission_rel
              if not submission_path.exists():
                continue
              try:
                submission_data = json.loads(submission_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                continue
              submission_data["最后部署时间"] = deploy_time
              submission_path.write_text(json.dumps(submission_data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Build course manifest
        run: python3 local/build_course_manifest.py --public-root webapp/public --collection-index webapp/public/collections.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Deploy to EdgeOne Pages
        if: ${{ vars.EDGEONE_PAGES_ENABLED == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA }}
        run: |
          if [ -z "${EDGEONE_API_TOKEN}" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          if [ -z "${EDGEONE_PROJECT_NAME}" ]; then
            echo "::error::EDGEONE_PROJECT_NAME variable is required"
            exit 1
          fi
          area="${EDGEONE_PAGES_AREA:-overseas}"
          echo "Deploying webapp/dist to EdgeOne Pages project '${EDGEONE_PROJECT_NAME}' in area '${area}'."
          npx --yes edgeone@latest makers deploy webapp/dist \
            -n "${EDGEONE_PROJECT_NAME}" \
            -t "${EDGEONE_API_TOKEN}" \
            -e production \
            -a "${area}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare Cache
        if: ${{ vars.CF_PURGE_ENABLED == '1' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "Skip purge: CF_API_TOKEN or CF_ZONE_ID is not set."
            exit 0
          fi
          if ! curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'; then
            echo "::warning::Cloudflare cache purge failed; static site deployments already completed."
          fi
